<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Une facture télécom que l'on peut optimiser</title>
  <desc id="desc">Smartphone, box internet, signal Wi-Fi et facture avec prélèvements, reliés par une flèche d'optimisation vers une coche et des barres en baisse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ef"/>
      <stop offset="1" stop-color="#f8f7f1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8f4"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1120" height="595" rx="30" fill="url(#bg)" stroke="#d7e6db" stroke-width="3"/>
  <circle cx="1035" cy="150" r="120" fill="#e2efe4"/>
  <circle cx="180" cy="575" r="90" fill="#e2efe4"/>

  <!-- Smartphone -->
  <g>
    <rect x="185" y="175" width="150" height="310" rx="30" fill="#075846"/>
    <rect x="199" y="189" width="122" height="282" rx="22" fill="url(#panel)"/>
    <rect x="235" y="202" width="50" height="7" rx="3.5" fill="#075846"/>
    <line x1="220" y1="240" x2="300" y2="240" stroke="#d9e6dd" stroke-width="10" stroke-linecap="round"/>
    <line x1="220" y1="266" x2="286" y2="266" stroke="#d9e6dd" stroke-width="10" stroke-linecap="round"/>
    <line x1="220" y1="292" x2="300" y2="292" stroke="#e4eee7" stroke-width="10" stroke-linecap="round"/>
    <rect x="220" y="316" width="80" height="90" rx="12" fill="#eef4ef" stroke="#075846" stroke-width="3"/>
    <line x1="236" y1="336" x2="284" y2="336" stroke="#7fa593" stroke-width="7" stroke-linecap="round"/>
    <line x1="236" y1="354" x2="270" y2="354" stroke="#7fa593" stroke-width="7" stroke-linecap="round"/>
    <line x1="236" y1="372" x2="284" y2="372" stroke="#c3d8ca" stroke-width="7" stroke-linecap="round"/>
    <line x1="236" y1="390" x2="258" y2="390" stroke="#c3d8ca" stroke-width="7" stroke-linecap="round"/>
    <rect x="242" y="448" width="36" height="6" rx="3" fill="#075846"/>
  </g>
  <!-- Wi-Fi -->
  <g fill="none" stroke="#ef873e" stroke-width="9" stroke-linecap="round">
    <path d="M260 128 a58 58 0 0 1 82 0"/>
    <path d="M278 146 a38 38 0 0 1 46 0"/>
    <circle cx="301" cy="176" r="6" fill="#ef873e" stroke="none"/>
  </g>

  <!-- Box internet -->
  <g>
    <line x1="545" y1="205" x2="545" y2="165" stroke="#3f6f5c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="545" cy="155" r="9" fill="#ef873e"/>
    <rect x="470" y="205" width="170" height="215" rx="22" fill="#ffffff" stroke="#d7e6db" stroke-width="4"/>
    <rect x="470" y="205" width="170" height="52" rx="22" fill="#075846"/>
    <circle cx="500" cy="231" r="6" fill="#7fd4a9"/>
    <circle cx="522" cy="231" r="6" fill="#9db3a6"/>
    <line x1="500" y1="300" x2="610" y2="300" stroke="#e4eee7" stroke-width="10" stroke-linecap="round"/>
    <line x1="500" y1="330" x2="610" y2="330" stroke="#e4eee7" stroke-width="10" stroke-linecap="round"/>
    <line x1="500" y1="360" x2="582" y2="360" stroke="#eef4ef" stroke-width="10" stroke-linecap="round"/>
    <rect x="500" y="380" width="56" height="16" rx="8" fill="#eef4ef"/>
    <circle cx="584" cy="388" r="6" fill="#ef873e"/>
  </g>

  <!-- Facture avec prélèvements -->
  <g>
    <rect x="700" y="215" width="180" height="250" rx="14" fill="#ffffff" stroke="#d7e6db" stroke-width="4"/>
    <line x1="724" y1="248" x2="856" y2="248" stroke="#075846" stroke-width="10" stroke-linecap="round"/>
    <line x1="724" y1="286" x2="856" y2="286" stroke="#eef4ef" stroke-width="10" stroke-linecap="round"/>
    <line x1="724" y1="316" x2="856" y2="316" stroke="#eef4ef" stroke-width="10" stroke-linecap="round"/>
    <line x1="724" y1="346" x2="856" y2="346" stroke="#eef4ef" stroke-width="10" stroke-linecap="round"/>
    <circle cx="746" cy="286" r="8" fill="#ef873e"/>
    <circle cx="746" cy="316" r="8" fill="#ef873e"/>
    <circle cx="746" cy="346" r="8" fill="#9db3a6"/>
    <circle cx="790" cy="412" r="26" fill="#eef4ef" stroke="#075846" stroke-width="4"/>
  </g>

  <!-- Flèche d'optimisation -->
  <g fill="none" stroke="#ef873e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870 470 C 910 520, 950 520, 985 505"/>
    <path d="M985 505 l-30 -2 M985 505 l-12 -27"/>
  </g>

  <!-- Barres en baisse + coche -->
  <g>
    <rect x="1015" y="430" width="34" height="88" rx="10" fill="#075846"/>
    <rect x="1061" y="460" width="34" height="58" rx="10" fill="#4f7d9c"/>
    <rect x="1107" y="485" width="34" height="33" rx="10" fill="#ef873e"/>
    <circle cx="1061" cy="545" r="46" fill="#075846"/>
    <path d="M1040 545 l15 15 l28 -32" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>